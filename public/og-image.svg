<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="glow" cx="600" cy="200" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4cd7f6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10131a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#0a0c10"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#4cd7f6" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Brand Terminal Pill Badge -->
  <g transform="translate(80, 80)">
    <rect width="220" height="38" rx="19" fill="#1b202c" stroke="#4cd7f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="24" cy="19" r="5" fill="#4edea3"/>
    <text x="38" y="24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#4cd7f6" letter-spacing="1.5">SHAWON.DEV // 2026</text>
  </g>

  <!-- Name Headline -->
  <text x="80" y="220" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    MD Shawon Molla
  </text>

  <!-- Role Subtitle -->
  <text x="80" y="280" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="32" font-weight="700" fill="url(#primaryGrad)">
    Full-Stack Systems &amp; Autonomous AI Architect
  </text>

  <!-- Description paragraph -->
  <text x="80" y="340" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#93a1b8">
    Production web architectures, multi-tenant AI pipelines, and high-concurrency platforms.
  </text>
  <text x="80" y="375" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#93a1b8">
    Next.js • NestJS • TypeScript • PostgreSQL • Three.js WebGL • Redis
  </text>

  <!-- Telemetry Pill Highlights -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="180" height="70" rx="14" fill="#141823" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="34" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#4cd7f6">97 Tables</text>
    <text x="24" y="54" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-transform="uppercase">PG Database</text>

    <rect x="200" y="0" width="180" height="70" rx="14" fill="#141823" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="224" y="34" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#4edea3">99.9%</text>
    <text x="224" y="54" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-transform="uppercase">Platform Uptime</text>

    <rect x="400" y="0" width="180" height="70" rx="14" fill="#141823" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="424" y="34" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#f59e0b">91+ Tests</text>
    <text x="424" y="54" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-transform="uppercase">Automated Suite</text>
  </g>

  <!-- Bottom URL / Signature -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" fill="#4cd7f6">https://shawon.dev</text>
    <text x="220" y="0" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#475569">• Verified CS Graduate &amp; Software Engineer</text>
  </g>
</svg>
