    <!-- PHASE 5: OpenGraph contract completed — secure_url, type, locale and
         alt text are what Twitter/X, LinkedIn and Slack actually read. -->
    <meta property="og:title" content="MD Shawon Molla | Full-Stack Engineer, Product Systems &amp; AI" />
    <meta property="og:description" content="Full-stack engineer building resilient product systems, AI workflows, and scalable web experiences for real users." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_ORIGIN%" />
    <meta property="og:site_name" content="Shawon.dev — MD Shawon Molla" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.png" />

    <meta name="twitter:image:alt" content="Shawon.dev — software engineering portfolio" />

    <!-- PHASE 5: this script is replaced at runtime by src/utils/seo.ts with a
         per-section @graph; it ships in the HTML so crawlers that never execute
         JavaScript still receive a complete entity graph. -->
    <script type="application/ld+json" id="seo-structured-data">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "%SITE_ORIGIN%/#website",
          "url": "%SITE_ORIGIN%/",
          "name": "Shawon.dev",
          "description": "Full-stack engineer building resilient product systems, AI workflows, and scalable web experiences for real users.",
          "inLanguage": "en-US",
          "publisher": { "@id": "%SITE_ORIGIN%/#person" }
        },
        {
          "@type": "Person",
          "@id": "%SITE_ORIGIN%/#person",
          "name": "MD Shawon Molla",
          "alternateName": "Shawon Molla",
          "jobTitle": "Full-Stack Engineer, Product Systems & AI",
          "description": "Full-stack engineer building resilient product systems, AI workflows, and scalable web experiences for real users.",
          "url": "%SITE_ORIGIN%/",
          "image": "%SITE_ORIGIN%/og-image.png",
          "email": "mailto:22103330@iubat.edu",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Dhaka",
            "addressCountry": "BD"
          },
          "knowsLanguage": ["en", "bn"],
          "knowsAbout": [
            "Full-Stack Web Development",
            "Distributed Systems Architecture",
            "Autonomous AI & LangChain RAG",
            "TypeScript & React",
            "Node.js & Python",
            "PostgreSQL & Prisma",
            "Three.js / WebGL"
          ],
          "alumniOf": {
            "@type": "CollegeOrUniversity",
            "name": "Independent University, Bangladesh"
          },
          "sameAs": [
            "https://github.com/shawon2210",
            "https://linkedin.com/in/md-shawon-molla-2a3877293"
          ]
        },
        {
          "@type": "ProfilePage",
          "@id": "%SITE_ORIGIN%/#webpage",
          "url": "%SITE_ORIGIN%/",
          "name": "MD Shawon Molla | Full-Stack Engineer, Product Systems & AI",
          "description": "Full-stack engineer building resilient product systems, AI workflows, and scalable web experiences for real users.",
          "isPartOf": { "@id": "%SITE_ORIGIN%/#website" },
          "about": { "@id": "%SITE_ORIGIN%/#person" },
          "mainEntity": { "@id": "%SITE_ORIGIN%/#person" },
          "inLanguage": "en-US"
        }
      ]
    }
    </script>

    <!-- PHASE 5: reduced-motion users get the end state painted on the very
         first frame, so the intro never becomes a black flash before JS runs. -->
    <style>
      html { background-color: #090b11; color: #e2e8f0; }
      @media (prefers-reduced-motion: reduce) {
        #root { opacity: 1 !important; }
      }
      /* Reserve the hero's first viewport so the entrance cannot shift layout. */
      #root { min-height: 100vh; }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.rel='stylesheet'" />

</html>
