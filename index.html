    <!-- PHASE 5: OpenGraph contract completed — secure_url, type, locale and
         alt text are what Twitter/X, LinkedIn and Slack actually read. -->

    <meta property="og:description" content="Full-stack software engineer building high-concurrency web platforms, distributed services, and AI orchestration systems." />

    <!-- PHASE 5: this script is replaced at runtime by src/utils/seo.ts with a
         per-section @graph; it ships in the HTML so crawlers that never execute
         JavaScript still receive a complete entity graph. -->
    <script type="application/ld+json" id="seo-structured-data">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://shawon.dev/#website",
          "url": "https://shawon.dev/",
          "name": "Shawon.dev",
          "description": "Software engineering portfolio of MD Shawon Molla.",
          "inLanguage": "en-US",
          "publisher": { "@id": "https://shawon.dev/#person" }
        },
        {
          "@type": "Person",
          "@id": "https://shawon.dev/#person",
          "name": "MD Shawon Molla",
          "alternateName": "Shawon Molla",
          "jobTitle": "Software Engineer & Systems Architect",
          "description": "Full-stack software engineer building high-concurrency web platforms, distributed services, and AI orchestration systems.",
          "url": "https://shawon.dev/",
          "image": "https://shawon.dev/og-image.png",
          "email": "mailto:22103330@iubat.edu",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Dhaka",
            "addressCountry": "BD"
          },
          "knowsLanguage": ["en", "bn"],
          "knowsAbout": [
            "Full-Stack Web Development",
            "Distributed Systems Architecture",
            "Autonomous AI & LangChain RAG",
            "TypeScript & React",
            "Node.js & Python",
            "PostgreSQL & Prisma",
            "Three.js / WebGL"
          ],
          "alumniOf": {
            "@type": "CollegeOrUniversity",
            "name": "Independent University, Bangladesh"
          },
          "sameAs": [
            "https://github.com/shawon2210",
            "https://linkedin.com/in/shawon"
          ]
        },
        {
          "@type": "ProfilePage",
          "@id": "https://shawon.dev/#webpage",
          "url": "https://shawon.dev/",
          "name": "MD Shawon Molla | Software Engineer & Systems Architect",
          "description": "Full-stack software engineer building high-concurrency web platforms, distributed services, and AI orchestration systems.",
          "isPartOf": { "@id": "https://shawon.dev/#website" },
          "about": { "@id": "https://shawon.dev/#person" },
          "mainEntity": { "@id": "https://shawon.dev/#person" },
          "inLanguage": "en-US"
        }
      ]
    }
    </script>

    <!-- PHASE 5: reduced-motion users get the end state painted on the very
         first frame, so the intro never becomes a black flash before JS runs. -->
    <style>
      html { background-color: #090b11; color: #e2e8f0; }
      @media (prefers-reduced-motion: reduce) {
        #root { opacity: 1 !important; }
      }
      /* Reserve the hero's first viewport so the entrance cannot shift layout. */
      #root { min-height: 100vh; }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
